<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142c28"><meta name="description" content="Haoxuan 的训练与睡眠记录，自动保存，离线可用。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Training Log"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"><title>Haoxuan Training Log</title><script src="./storage-compat.js" defer></script><script src="./cardio.js" defer></script><script src="./daily-status.js" defer></script><script src="./plan-import.js" defer></script><script src="./pwa-ui.js" defer></script><script src="./data-recovery.js" defer></script><script src="./health-sleep-import.js" defer></script><script src="./app.js" defer></script></head><body><header class="brand app-container"><span class="mark">H<span>↗</span></span><div><strong>HAOXUAN</strong><small>TRAINING LOG</small></div><span id="save-status" role="status">● 本地自动保存</span></header><main id="app" class="app-container"></main><nav class="bottom-nav" aria-label="主导航"><button data-view="training"><span class="nav-icon" aria-hidden="true"><span class="nav-icon-metric">◉</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg></span><span class="nav-label">今日训练</span></button><button data-view="sleep"><span class="nav-icon" aria-hidden="true"><span class="nav-icon-metric">☾</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M20.7 15.2A9 9 0 0 1 8.8 3.3a9 9 0 1 0 11.9 11.9Z"/></svg></span><span class="nav-label">每日状态</span></button><button data-view="history"><span class="nav-icon" aria-hidden="true"><span class="nav-icon-metric">◷</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 4v8h8"/></svg></span><span class="nav-label">历史记录</span></button></nav><div id="toast" role="status"></div><dialog id="summary-dialog"><div class="row"><h2>训练反馈</h2><button id="close-summary" aria-label="关闭反馈">✕</button></div><p class="muted">复制后，直接粘贴到 ChatGPT。</p><textarea id="summary" readonly aria-label="训练反馈文本"></textarea><button class="primary full" id="copy">复制到剪贴板</button><p id="copy-status" role="status"></p></dialog><dialog id="import-dialog" aria-labelledby="import-title"><header class="import-header"><h2 id="import-title">导入训练计划</h2><button id="cancel-import">取消</button></header><div id="import-scroll"><p id="import-error" role="alert"></p><section id="import-editor"><label for="plan-json">粘贴 ChatGPT 生成的训练计划 JSON</label><textarea id="plan-json" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div class="example-actions"><button data-example="strength">载入力量示例</button><button data-example="cardio">载入有氧示例</button></div><button id="parse-import" class="primary full">解析计划</button></section><section id="import-preview" hidden><div id="import-preview-content"></div><p id="import-conflict" role="status"></p><div class="preview-actions"><button id="edit-import" class="full">返回修改</button><button id="confirm-import" class="primary full">确认导入</button></div></section></div></dialog><dialog id="export-dialog" class="recovery-dialog" aria-labelledby="export-title"><header class="import-header"><h2 id="export-title">导出全部数据</h2><button id="close-export">关闭</button></header><div class="recovery-scroll"><p>完整备份仅在此设备显示，请自行妥善保存。</p><textarea id="backup-output" readonly aria-label="备份 JSON"></textarea><button id="copy-backup" class="primary full">复制备份JSON</button><p id="backup-copy-status" role="status"></p></div></dialog><dialog id="backup-dialog" class="recovery-dialog" aria-labelledby="backup-title"><header class="import-header"><h2 id="backup-title">导入备份</h2><button id="cancel-backup">取消</button></header><div class="recovery-scroll"><p id="backup-error" role="alert"></p><section id="backup-editor"><label for="backup-input">粘贴完整备份 JSON。仅合并缺失数据。</label><textarea id="backup-input" spellcheck="false" autocapitalize="off"></textarea><button id="parse-backup" class="primary full">解析备份</button></section><section id="backup-preview" hidden><div id="backup-preview-content"></div><div class="preview-actions"><button id="edit-backup">返回修改</button><button id="confirm-backup" class="primary">确认合并</button></div></section></div></dialog><dialog id="health-dialog" class="recovery-dialog" aria-labelledby="health-title"><header class="import-header"><h2 id="health-title">Apple 健康睡眠</h2><button id="close-health">关闭</button></header><div class="recovery-scroll"><p id="health-error" role="alert"></p><section id="health-editor"><p>先运行 Haoxuan Sleep Export 快捷指令，再从剪贴板导入。</p><div class="health-actions"><button id="health-clipboard" class="primary full">从剪贴板读取</button><button id="health-paste" class="full">手动粘贴 JSON</button><a class="health-guide-link" href="./shortcuts-apple-health.html" target="_blank" rel="noopener">查看快捷指令设置教程 ↗</a></div><div id="health-manual" hidden><label for="health-json">粘贴睡眠 JSON</label><textarea id="health-json" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><button id="parse-health" class="primary full">解析睡眠</button></div></section><section id="health-preview" hidden><div id="health-preview-content"></div><button id="replace-health-fields" class="full" aria-pressed="false">使用 Apple 健康值替换客观睡眠字段</button><p class="muted">默认只补空值。此选项不会修改主观评分、备注、咖啡因或午睡。</p><div class="preview-actions"><button id="edit-health">返回修改</button><button id="confirm-health" class="primary">确认导入</button></div></section></div></dialog></body></html>
