<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142c28"><meta name="description" content="Haoxuan 的训练与睡眠记录，自动保存，离线可用。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Training Log"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"><title>Haoxuan Training Log</title><script src="./app.js" defer></script></head><body><header class="brand app-container"><span class="mark">H<span>↗</span></span><div><strong>HAOXUAN</strong><small>TRAINING LOG</small></div><span id="save-status" role="status">● 本地自动保存</span></header><main id="app" class="app-container"></main><nav aria-label="主导航"><button data-view="training">◉<span>今日训练</span></button><button data-view="sleep">☾<span>睡眠精神</span></button><button data-view="history">◷<span>历史记录</span></button></nav><div id="toast" role="status"></div><dialog id="summary-dialog"><div class="row"><h2>训练反馈</h2><button id="close-summary" aria-label="关闭反馈">✕</button></div><p class="muted">复制后，直接粘贴到 ChatGPT。</p><textarea id="summary" readonly aria-label="训练反馈文本"></textarea><button class="primary full" id="copy">复制到剪贴板</button><p id="copy-status" role="status"></p></dialog></body></html>
